<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caravanleveller</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <style>
        body {
            font-family: Arial;
            margin: 20px;
            text-align: center;
        }
        input {
            width: 200px;
            padding: 8px;
            font-size: 16px;
        }
        .value {
            font-size: 24px;
            margin: 10px 0;
        }
        button {
            padding: 12px;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h1>Caravanleveller</h1>

    <h3>Instellingen</h3>

    <label>Afstand linker–rechter wiel (cm):</label><br>
    <input id="wielbreedte" type="number" oninput="saveSettings()"><br><br>

    <label>Afstand as tot steunwiel (cm):</label><br>
    <input id="asafstand" type="number" oninput="saveSettings()"><br><br>

    <hr>

    <h3>Sensorwaarden</h3>
    <div class="value">Pitch: <span id="pitch">0</span>°</div>
    <div class="value">Roll: <span id="roll">0</span>°</div>

    <h3>Benodigde ophoog‑hoogte</h3>
    <p id="pitchHoogte">Pitch: —</p>
    <p id="rollHoogte">Roll: —</p>

    <button onclick="startSensors()">Sensoren inschakelen</button>

    <script>
        /* ------------------------------
           Instellingen opslaan & laden
        ------------------------------ */

        function saveSettings() {
            localStorage.setItem("wielbreedte", document.getElementById("wielbreedte").value);
            localStorage.setItem("asafstand", document.getElementById("asafstand").value);
        }

        function loadSettings() {
            const wb = localStorage.getItem("wielbreedte");
            const aa = localStorage.getItem("asafstand");

            if (wb) document.getElementById("wielbreedte").value = wb;
            if (aa) document.getElementById("asafstand").value = aa;
        }

        /* ------------------------------
           Berekeningen Pitch & Roll
        ------------------------------ */

        function berekenPitchHoogte(pitchDegrees) {
            const wielbreedte = parseFloat(localStorage.getItem("wielbreedte"));
            if (!wielbreedte) return null;

            const pitchRad = pitchDegrees * Math.PI / 180;
            return Math.tan(pitchRad) * (wielbreedte / 2);
        }

        function berekenRollHoogte(rollDegrees) {
            const asafstand = parseFloat(localStorage.getItem("asafstand"));
            if (!asafstand) return null;

            const rollRad = rollDegrees * Math.PI / 180;
            return Math.tan(rollRad) * asafstand;
        }

        /* ------------------------------
           Sensoren starten (iPhone)
        ------------------------------ */

        function startSensors() {
            if (typeof DeviceOrientationEvent.requestPermission === "function") {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === "granted") {
                        window.addEventListener("deviceorientation", handleOrientation);
                    }
                });
            } else {
                window.addEventListener("deviceorientation", handleOrientation);
            }
        }

        function handleOrientation(event) {
            const pitch = event.beta || 0;  // voor/achter
            const roll = event.gamma || 0;  // links/rechts

            document.getElementById("pitch").innerText = pitch.toFixed(1);
            document.getElementById("roll").innerText = roll.toFixed(1);

            const pitchHoogte = berekenPitchHoogte(pitch);
            const rollHoogte = berekenRollHoogte(roll);

            if (pitchHoogte !== null) {
                document.getElementById("pitchHoogte").innerText =
                    "Links/rechts ophogen: " + pitchHoogte.toFixed(1) + " cm";
            }

            if (rollHoogte !== null) {
                document.getElementById("rollHoogte").innerText =
                    "Voor/achter ophogen: " + rollHoogte.toFixed(1) + " cm";
            }
        }

        /* ------------------------------
           PWA service worker
        ------------------------------ */

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js");
        }

        /* ------------------------------
           Start
        ------------------------------ */

        window.onload = loadSettings;
    </script>
</body>
</html>
